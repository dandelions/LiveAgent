name: Gateway Docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.1.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Gateway Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 💥 关键修改 1：全局强制将仓库名/所有者转为纯小写，防止 GHCR 路径大小写混淆
      - name: Set lower case image name
        run: |
          IMAGE_REPO="ghcr.io/${{ github.repository_owner }}/liveagent-gateway"
          echo "IMAGE_NAME=$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.event.inputs.tag || github.ref_name }}
            type=raw,value=latest

      # 💥 关键修改 2：关闭 GitHub Actions 缓存（cache-from/to），并开启 provenance
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 禁用 gha 缓存防止跨架构构建阶段交叉污染；如需缓存，请使用 type=inline
          cache-from: ""
          cache-to: ""
          provenance: false

      # 💥 关键修改 3：升级验证步骤，避免本地 Docker 缓存或默认 Platform 回退
      - name: Verify per-arch binaries
        run: |
          set -euo pipefail
          repo="${{ env.IMAGE_NAME }}"
          index="$repo@${{ steps.push.outputs.digest }}"
          
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) want="x86-64" ;;
              arm64) want="aarch64" ;;
            esac

            digest="$(docker buildx imagetools inspect --raw "$index" \
              | jq -r --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')"
            
            test -n "$digest" || { echo "::error::pushed index has no linux/$arch manifest"; exit 1; }
            
            echo "Checking $arch manifest digest: $digest"
            docker pull --platform "linux/$arch" "$repo@$digest" >/dev/null
            docker rm -f "verify-$arch" >/dev/null 2>&1 || true
            docker create --name "verify-$arch" --platform "linux/$arch" "$repo@$digest" >/dev/null
            docker cp "verify-$arch:/usr/local/bin/liveagent-gateway" "/tmp/gateway-$arch"
            docker rm -f "verify-$arch" >/dev/null
            
            info="$(file -b "/tmp/gateway-$arch")"
            echo "linux/$arch binary info: $info"
            echo "$info" | grep -q "$want" || { echo "::error::linux/$arch image contains a non-$arch gateway binary ($info)"; exit 1; }
          done
