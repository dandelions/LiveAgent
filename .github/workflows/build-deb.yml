name: Build Linux Deb

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build deb for (e.g. v1.3.6)
        required: false

permissions:
  contents: write

env:
  NODE_VERSION: 22.19.0

jobs:
  build-deb:
    name: Build Linux Deb
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve target tag
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare release version config
        working-directory: crates/agent-gui
        env:
          TARGET_TAG: ${{ steps.meta.outputs.tag }}
        run: node ../../scripts/release/prepare-app-version-from-tag.mjs "$TARGET_TAG" --github-env "$GITHUB_ENV" --tauri-config src-tauri/tauri.version.generated.conf.json

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            unzip \
            wget

      - name: Install protobuf compiler
        env:
          PROTOC_VERSION: "34.0"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -oq /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          echo "PROTOC=/usr/local/bin/protoc" >> "$GITHUB_ENV"
          /usr/local/bin/protoc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/agent-gui/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter liveagent...

      - name: Build Linux deb bundle
        working-directory: crates/agent-gui
        run: |
          pnpm tauri build \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' \
            --config "$LIVEAGENT_TAURI_VERSION_CONFIG" \
            --target x86_64-unknown-linux-gnu \
            --bundles deb

      - name: Stage deb artifact
        env:
          TARGET_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          deb_path="$(find crates/agent-gui/src-tauri/target target -type f -name '*.deb' -path '*bundle*' -print -quit 2>/dev/null || true)"
          test -n "$deb_path"
          echo "Found deb: $deb_path"
          cp "$deb_path" "dist/LiveAgent-${TARGET_TAG}-Linux-x86_64.deb"
          if [ -f "$deb_path.sig" ]; then
            cp "$deb_path.sig" "dist/LiveAgent-${TARGET_TAG}-Linux-x86_64.deb.sig"
          fi

      - name: Upload deb to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # 如果 Release 已经存在则直接上传 asset，如果不存在则自动创建一个
          if ! gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            gh release create "$TARGET_TAG" --title "LiveAgent $TARGET_TAG" --notes "Release $TARGET_TAG" dist/*
          else
            gh release upload "$TARGET_TAG" dist/* --clobber
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: liveagent-linux-deb
          path: dist/*
          if-no-files-found: error
